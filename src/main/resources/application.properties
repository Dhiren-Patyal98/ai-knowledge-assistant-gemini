spring.application.name=file-upload-system


# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:ai_knowledge_assistant}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}


# ===============================
# SQL LOGGING
# ===============================

# Show SQL Queries
logging.level.org.hibernate.SQL=DEBUG

# Show Query Parameters
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Show JDBC Operations
logging.level.org.springframework.jdbc.core=DEBUG

# ===============================
# TURN OFF NOISY LOGS
# ===============================

logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# ===============================
# JWT CONFIGURATION
# ===============================

# JWT secret must be provided through an environment variable.
# Do NOT put the actual secret in this file.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# DOCUMENT STORAGE
# ===============================
document.upload-dir=${DOCUMENT_UPLOAD_DIR:uploads}

# ===============================
# CHUNK SIZES AND OVERLAP SIZE
# ===============================
chunk.size=${CHUNK_SIZE:300}
chunk.overlap=${CHUNK_OVERLAP:50}


# ===============================
# GEMINI CONFIGURATION
# ===============================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash}

spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.model.embedding.text=google-genai


# ===============================
# REDIS CONFIGURATION
# ===============================

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}


# ===============================
# KAFKA CONFIGURATION
# ===============================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:file-upload-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*


# ===============================
# Retrieval Limit
# ===============================

retrieval.top-k=${RETRIEVAL_TOP_K:5}


